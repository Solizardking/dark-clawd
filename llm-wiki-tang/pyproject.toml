[project]
name = "llm-wiki-tang"
version = "0.1.0"
description = "Local OpenClawd AutoResearch API for clawd-tui"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2",
  "python-dotenv>=1",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27",
  "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
