<svg xmlns="http://www.w3.org/2000/svg" width="920" height="280" viewBox="0 0 920 280" role="img" aria-label="Dark Clawd — forged from Ralph on Solana">
  <title>Dark Clawd</title>
  <desc>Animated Dark Clawd terminal banner. Forged from Ralph on Solana.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05080f"/>
      <stop offset="50%" stop-color="#0a1220"/>
      <stop offset="100%" stop-color="#05080f"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="40%" stop-color="#22d3ee"/>
      <stop offset="70%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6">
        <animate attributeName="stop-color" values="#f472b6;#22d3ee;#a78bfa;#f472b6" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="frameClip">
      <rect x="8" y="8" width="904" height="264" rx="14"/>
    </clipPath>
    <style><![CDATA[
      .pulse-dot {
        animation: blink 1.2s ease-in-out infinite;
      }
      .title-glow {
        animation: titlePulse 2.8s ease-in-out infinite;
      }
      .scanline {
        animation: scan 3.2s linear infinite;
      }
      .ticker {
        animation: scroll 8s linear infinite;
      }
      .bar {
        animation: barPulse 1.6s ease-in-out infinite;
        transform-origin: center bottom;
      }
      .bar:nth-child(2) { animation-delay: 0.1s; }
      .bar:nth-child(3) { animation-delay: 0.2s; }
      .bar:nth-child(4) { animation-delay: 0.3s; }
      .bar:nth-child(5) { animation-delay: 0.4s; }
      .bar:nth-child(6) { animation-delay: 0.5s; }
      .bar:nth-child(7) { animation-delay: 0.6s; }
      .bar:nth-child(8) { animation-delay: 0.7s; }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.25; }
      }
      @keyframes titlePulse {
        0%, 100% { opacity: 0.92; filter: drop-shadow(0 0 6px #22d3ee); }
        50% { opacity: 1; filter: drop-shadow(0 0 16px #a78bfa); }
      }
      @keyframes scan {
        0% { transform: translateY(-40px); opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { transform: translateY(260px); opacity: 0; }
      }
      @keyframes scroll {
        0% { transform: translateX(0); }
        100% { transform: translateX(-220px); }
      }
      @keyframes barPulse {
        0%, 100% { transform: scaleY(0.55); }
        50% { transform: scaleY(1); }
      }
    ]]></style>
  </defs>

  <!-- Frame -->
  <rect width="920" height="280" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="904" height="264" rx="14" fill="#070b14" stroke="#1e293b" stroke-width="2"/>
  <rect x="8" y="8" width="904" height="264" rx="14" fill="none" stroke="#22d3ee" stroke-opacity="0.35" stroke-width="1">
    <animate attributeName="stroke-opacity" values="0.2;0.65;0.2" dur="2.4s" repeatCount="indefinite"/>
  </rect>

  <g clip-path="url(#frameClip)">
    <!-- Grid -->
    <g stroke="#122033" stroke-width="1" opacity="0.7">
      <path d="M0 56 H920 M0 112 H920 M0 168 H920 M0 224 H920"/>
      <path d="M115 0 V280 M230 0 V280 M345 0 V280 M460 0 V280 M575 0 V280 M690 0 V280 M805 0 V280"/>
    </g>

    <!-- Scanline -->
    <rect class="scanline" x="8" y="0" width="904" height="36" fill="url(#scanGrad)" opacity="0.85">
      <animateTransform attributeName="transform" type="translate" from="0 -40" to="0 280" dur="3.2s" repeatCount="indefinite"/>
    </rect>

    <!-- Status bar -->
    <rect x="24" y="22" width="872" height="28" rx="6" fill="#0b1220" stroke="#1f3a4d" stroke-width="1"/>
    <circle class="pulse-dot" cx="44" cy="36" r="5" fill="#34d399" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <text x="58" y="41" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12">DARK CLAWD</text>
    <text x="150" y="41" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="700">● OPERATIONAL</text>
    <text x="300" y="41" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12">Uptime 00:04:35</text>
    <text x="760" y="41" fill="#22d3ee" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12">SOLANA · LIVE</text>

    <!-- Main title -->
    <text class="title-glow" x="460" y="120" text-anchor="middle" fill="url(#titleGrad)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="48" font-weight="800" letter-spacing="6" filter="url(#softGlow)">
      DARK CLAWD
      <animate attributeName="opacity" values="0.88;1;0.88" dur="2.8s" repeatCount="indefinite"/>
    </text>
    <text x="460" y="152" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" letter-spacing="3">
      AUTONOMOUS SOLANA TERMINAL INTELLIGENCE
    </text>
    <text x="460" y="178" text-anchor="middle" fill="#a78bfa" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" letter-spacing="1">
      ◈ forged from Ralph on Solana ◈
      <animate attributeName="fill" values="#a78bfa;#22d3ee;#f472b6;#a78bfa" dur="5s" repeatCount="indefinite"/>
    </text>

    <!-- Mini EQ bars -->
    <g transform="translate(300 210)" fill="#22d3ee" opacity="0.9">
      <rect class="bar" x="0" y="0" width="10" height="28" rx="2">
        <animate attributeName="height" values="10;28;14;28;10" dur="1.4s" repeatCount="indefinite"/>
        <animate attributeName="y" values="18;0;14;0;18" dur="1.4s" repeatCount="indefinite"/>
      </rect>
      <rect class="bar" x="16" y="0" width="10" height="28" rx="2">
        <animate attributeName="height" values="18;8;28;12;18" dur="1.1s" repeatCount="indefinite"/>
        <animate attributeName="y" values="10;20;0;16;10" dur="1.1s" repeatCount="indefinite"/>
      </rect>
      <rect class="bar" x="32" y="0" width="10" height="28" rx="2">
        <animate attributeName="height" values="8;26;12;22;8" dur="1.6s" repeatCount="indefinite"/>
        <animate attributeName="y" values="20;2;16;6;20" dur="1.6s" repeatCount="indefinite"/>
      </rect>
      <rect class="bar" x="48" y="0" width="10" height="28" rx="2">
        <animate attributeName="height" values="22;12;28;10;22" dur="1.25s" repeatCount="indefinite"/>
        <animate attributeName="y" values="6;16;0;18;6" dur="1.25s" repeatCount="indefinite"/>
      </rect>
      <rect class="bar" x="64" y="0" width="10" height="28" rx="2">
        <animate attributeName="height" values="14;28;10;24;14" dur="1.35s" repeatCount="indefinite"/>
        <animate attributeName="y" values="14;0;18;4;14" dur="1.35s" repeatCount="indefinite"/>
      </rect>
      <rect class="bar" x="80" y="0" width="10" height="28" rx="2">
        <animate attributeName="height" values="26;10;20;28;26" dur="1.5s" repeatCount="indefinite"/>
        <animate attributeName="y" values="2;18;8;0;2" dur="1.5s" repeatCount="indefinite"/>
      </rect>
      <rect class="bar" x="96" y="0" width="10" height="28" rx="2">
        <animate attributeName="height" values="12;24;8;28;12" dur="1.2s" repeatCount="indefinite"/>
        <animate attributeName="y" values="16;4;20;0;16" dur="1.2s" repeatCount="indefinite"/>
      </rect>
      <rect class="bar" x="112" y="0" width="10" height="28" rx="2">
        <animate attributeName="height" values="20;8;26;14;20" dur="1.45s" repeatCount="indefinite"/>
        <animate attributeName="y" values="8;20;2;14;8" dur="1.45s" repeatCount="indefinite"/>
      </rect>
      <rect class="bar" x="128" y="0" width="10" height="28" rx="2">
        <animate attributeName="height" values="9;22;28;11;9" dur="1.3s" repeatCount="indefinite"/>
        <animate attributeName="y" values="19;6;0;17;19" dur="1.3s" repeatCount="indefinite"/>
      </rect>
      <rect class="bar" x="144" y="0" width="10" height="28" rx="2">
        <animate attributeName="height" values="24;14;8;28;24" dur="1.55s" repeatCount="indefinite"/>
        <animate attributeName="y" values="4;14;20;0;4" dur="1.55s" repeatCount="indefinite"/>
      </rect>
      <rect class="bar" x="160" y="0" width="10" height="28" rx="2">
        <animate attributeName="height" values="16;28;12;20;16" dur="1.15s" repeatCount="indefinite"/>
        <animate attributeName="y" values="12;0;16;8;12" dur="1.15s" repeatCount="indefinite"/>
      </rect>
      <rect class="bar" x="176" y="0" width="10" height="28" rx="2">
        <animate attributeName="height" values="11;19;28;9;11" dur="1.7s" repeatCount="indefinite"/>
        <animate attributeName="y" values="17;9;0;19;17" dur="1.7s" repeatCount="indefinite"/>
      </rect>
      <rect class="bar" x="192" y="0" width="10" height="28" rx="2">
        <animate attributeName="height" values="28;10;18;26;28" dur="1.05s" repeatCount="indefinite"/>
        <animate attributeName="y" values="0;18;10;2;0" dur="1.05s" repeatCount="indefinite"/>
      </rect>
      <rect class="bar" x="208" y="0" width="10" height="28" rx="2">
        <animate attributeName="height" values="13;25;9;22;13" dur="1.4s" repeatCount="indefinite"/>
        <animate attributeName="y" values="15;3;19;6;15" dur="1.4s" repeatCount="indefinite"/>
      </rect>
      <rect class="bar" x="224" y="0" width="10" height="28" rx="2">
        <animate attributeName="height" values="19;7;24;12;19" dur="1.28s" repeatCount="indefinite"/>
        <animate attributeName="y" values="9;21;4;16;9" dur="1.28s" repeatCount="indefinite"/>
      </rect>
      <rect class="bar" x="240" y="0" width="10" height="28" rx="2">
        <animate attributeName="height" values="7;21;15;28;7" dur="1.6s" repeatCount="indefinite"/>
        <animate attributeName="y" values="21;7;13;0;21" dur="1.6s" repeatCount="indefinite"/>
      </rect>
      <rect class="bar" x="256" y="0" width="10" height="28" rx="2">
        <animate attributeName="height" values="22;12;26;8;22" dur="1.22s" repeatCount="indefinite"/>
        <animate attributeName="y" values="6;16;2;20;6" dur="1.22s" repeatCount="indefinite"/>
      </rect>
      <rect class="bar" x="272" y="0" width="10" height="28" rx="2">
        <animate attributeName="height" values="15;28;11;20;15" dur="1.48s" repeatCount="indefinite"/>
        <animate attributeName="y" values="13;0;17;8;13" dur="1.48s" repeatCount="indefinite"/>
      </rect>
      <rect class="bar" x="288" y="0" width="10" height="28" rx="2">
        <animate attributeName="height" values="10;18;28;14;10" dur="1.33s" repeatCount="indefinite"/>
        <animate attributeName="y" values="18;10;0;14;18" dur="1.33s" repeatCount="indefinite"/>
      </rect>
      <rect class="bar" x="304" y="0" width="10" height="28" rx="2">
        <animate attributeName="height" values="26;9;16;24;26" dur="1.18s" repeatCount="indefinite"/>
        <animate attributeName="y" values="2;19;12;4;2" dur="1.18s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Ticker tape -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#64748b">
      <g class="ticker">
        <text x="24" y="258">SOL $150.25 +2.34%  ·  BONK +5.67%  ·  WIF -1.20%  ·  JUP +3.80%  ·  CLAWD LIVE  ·  forged from Ralph on Solana  ·  </text>
        <text x="620" y="258">SOL $150.25 +2.34%  ·  BONK +5.67%  ·  WIF -1.20%  ·  JUP +3.80%  ·  CLAWD LIVE  ·  forged from Ralph on Solana  ·  </text>
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-300 0" dur="8s" repeatCount="indefinite"/>
      </g>
    </g>
  </g>
</svg>
